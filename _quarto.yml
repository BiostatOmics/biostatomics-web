project:
  type: website

website:
  title: "biostatomics-web"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - about.qmd

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true

execute:
  freeze: auto # code chunks are executed locally and results are saved in `_freeze` directory. without this, GitHub Actions would need to install R/python and all dependencies, then execute every chunk, which is slower and failure-prone.


