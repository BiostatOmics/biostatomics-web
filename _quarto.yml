project:
  type: website

website:
  # basics
  title: "BiostatOmics Group"
  site-url: https://biostatomics.com # for SEO
  description: "BiostatOmics is a research group at the Universitat Politècnica de València (UPV) developing statistical and machine learning methods for the analysis of multi-omics data, applied to biomedical and clinical research."
  favicon: images/BioStatOmics_Favicon_web_512x512.svg # little icon that appears in browser tab

  repo-url: https://github.com/BiostatOmics/biostatomics-web
  # repo-actions: [edit, source, issue] # adds the "edit this page", "view source" and "report an issue" options in website footer

  image: images/Logo_BioStatOmics_300x300Px_color_Transparent_Bckg.png # thumbnail to show when sharing website link (open-graph/social media)
  image-alt: "BiostatOmics Group logo" # the description of the image for accesibility

  # social metadata options: enable to preview correctly the website (thumbnail, description, etc.) when sharing its link across social media (X, linkedin, etc.)
  open-graph: true
  twitter-card: true

  # enable google analytics to analyze users traffic (how many visits, which sites are more popular, where does traffic comes from, device type, etc.)
  # google-analytics: "G-XXXXXXXXXX"
  # cookie-consent: true # as google analytics uses cookies, we need to show the "cookie consent banner"

  # QoL utilities
  search: # search for any word in the whole web
    location: navbar
    type: overlay
    show-item-context: tree
  # back-to-top-navigation: true # when scrolling to the bottom of the web, show a button to go top
  # page-navigation: true # add previous/next arrow to navigate between sites/pages

  # ! website skeleton
  navbar: # navbar = top bar that display the different tabs for navegation
    pinned: true
    logo: images/BioStatOmics_Favicon_web_512x512.svg
    right:
      - text: "Home" # text is optional, by default, it takes the "title" value defined in the href. 
        href: index.qmd # href is the linked document (internal) or URL (external) that will appear when clicking the "text" label in the navigation panel
        icon: house-fill
      - text: "Research"
        icon: lightbulb-fill
        menu:
          - text: "Research lines"
            href: research_lines.qmd
            icon: folder2-open
          - text: "Publications"
            href: publications.qmd 
            icon: book
      - text: "Tools"
        href: tools/index.qmd
        icon: gear-fill
      - text: "Blog"
        href: blog.qmd
        icon: journal
      - text: "People"
        href: people/index.qmd
        icon: people-fill
      - text: "Contact"
        href: contact.qmd
        icon: envelope-fill

  page-footer: # footer = bottom bar shown on every page
    border: true
    background: light
    left: |
      © 2026 BiostatOmics <br>
      All content licensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)
    right: |
      Made with [Quarto](https://quarto.org) <br>
      View source at [<i class="bi bi-github"></i>](https://github.com/BiostatOmics/biostatomics-web)

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true # add a "table of contents" 
    include-in-header: # this allows to include HTML code in the HTML header of the website. HTML header contains all the external resources needed.
    # load AcademicIcons icon pack (for google scholar, orcid, zotero, etc.)
      - text: <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
    # load FontAwesome icon pack (not needed for now -> commented)
      # - text: <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css">
    # load AltMetric widget (for citations and impact of each paper, not needed for now -> commented)
      # - text: <script src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"></script>
    include-after-body:
      - file: includes/highlight-active-navbar-dropdown.html

execute:
  freeze: auto # code chunks are executed locally and results are saved in `_freeze` directory. without this, GitHub Actions would need to install R/python and all dependencies, then execute every chunk, which is slower and failure-prone.

metadata-files:
  - drafts.yml